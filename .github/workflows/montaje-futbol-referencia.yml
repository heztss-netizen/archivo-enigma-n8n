name: Montaje fútbol referencia
on:
  push:
    paths: ['.github/workflows/montaje-futbol-referencia.yml']
permissions:
  actions: read
  contents: read
jobs:
  editar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/download-artifact@v4
        with:
          name: futbol-referencia-escenas
          run-id: 40638594936
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: episodio-negrete
          run-id: 40575681826
          github-token: ${{ github.token }}
      - name: Montar escenas con voz y subtítulos
        run: |
          python3 - <<'PY'
          import subprocess,textwrap
          from pathlib import Path
          lines=["¿Un gol mexicano fue elegido el mejor de los Mundiales?","En mil novecientos ochenta y seis, Manuel Negrete marcó una tijera contra Bulgaria.","En dos mil dieciocho, aficionados lo eligieron en una votación de FIFA."]
          d=[]
          for i in range(3):
              subprocess.run(['ffmpeg','-v','error','-y','-i',f'voz_{i}.mp3','-ar','48000','-ac','1',f'a_{i}.wav'],check=True)
              d.append(float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',f'a_{i}.wav'])))
          Path('a.txt').write_text(''.join(f"file 'a_{i}.wav'\n" for i in range(3)))
          subprocess.run(['ffmpeg','-v','error','-y','-f','concat','-safe','0','-i','a.txt','-c','copy','voz.wav'],check=True)
          for i in range(5):
              subprocess.run(['ffmpeg','-v','error','-y','-i',f'escena_{i}.mp4','-t','5','-an','-vf','scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,fps=24,setsar=1','-c:v','libx264','-preset','veryfast','-crf','22','-pix_fmt','yuv420p',f'p_{i}.mp4'],check=True)
          Path('v.txt').write_text(''.join(f"file 'p_{i}.mp4'\n" for i in range(5)))
          subprocess.run(['ffmpeg','-v','error','-y','-f','concat','-safe','0','-i','v.txt','-c','copy','video.mp4'],check=True)
          def ts(t):
              c=round(t*100);return f'0:{c//6000:02d}:{c//100%60:02d}.{c%100:02d}'
          h='[Script Info]\nScriptType: v4.00+\nPlayResX: 720\nPlayResY: 1280\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\nStyle: Default,DejaVu Sans,32,&H0000FFFF,&H00FFFFFF,&H00000000,&H70000000,-1,0,0,0,100,100,0,0,1,2,1,2,65,65,230,1\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n'
          t=0
          for line,sec in zip(lines,d):
              chunks=textwrap.wrap(line,width=25)
              for j,c in enumerate(chunks):
                  h+=f'Dialogue: 0,{ts(t+sec*j/len(chunks))},{ts(t+sec*(j+1)/len(chunks))},Default,,0,0,0,,{c}\n'
              t+=sec
          if t>25: raise SystemExit('Narración excede las escenas; requiere revisión.')
          Path('subtitulos.ass').write_text(h,encoding='utf8')
          subprocess.run(['ffmpeg','-v','error','-y','-i','video.mp4','-i','voz.wav','-vf','ass=subtitulos.ass','-map','0:v','-map','1:a','-c:v','libx264','-preset','veryfast','-crf','21','-c:a','aac','-shortest','futbol.mp4'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: futbol-referencia-montaje
          path: |
            futbol.mp4
            subtitulos.ass
          retention-days: 7
