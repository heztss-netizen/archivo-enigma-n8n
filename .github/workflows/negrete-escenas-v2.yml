name: Escenas Negrete y votacion
on:
  push:
    paths: ['.github/workflows/negrete-escenas-v2.yml']
permissions:
  contents: read
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - run: python -m pip install fal-client requests
      - name: Generar dos planos
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          python - <<'PY'
          import fal_client,requests
          from pathlib import Path
          prompts=[
           "Vertical cinematic 3D animation, stylized historical football reenactment in a packed 1980s Mexico stadium. Wide side-on view of the penalty area and a rectangular soccer goal with crossbar and net. A Mexican footballer in a plain green shirt and white shorts receives a high pass, leaps sideways and performs an acrobatic sideways scissors kick, his foot hits the ball, the ball flies into the soccer net and goalkeeper dives. Camera follows the entire action clearly. No hands touching the ball, no rugby posts, no text, no logos.",
           "Vertical cinematic 3D animation, lively football fans of varied ages in green shirts gathered in a room vote enthusiastically on phones, close-ups of hands tapping generic screen buttons, joyful expressions, flowing camera, visually clear ballot boxes with abstract check marks, no legible text, no logos."
          ]
          for i,p in enumerate(prompts):
              d=fal_client.subscribe('fal-ai/kling-video/v2.5-turbo/pro/text-to-video',arguments={'prompt':p,'duration':'5','aspect_ratio':'9:16'})
              r=requests.get(d['video']['url'],timeout=(30,300));r.raise_for_status();Path(f'plano_{i}.mp4').write_bytes(r.content)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: negrete-v2-escenas
          path: plano_*.mp4
          retention-days: 7
