name: Prueba de Short Archivo Enigma
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prueba-short.yml'
permissions:
  contents: read
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar editor de video
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Instalar voz
        run: |
          python -m pip install 'piper-tts==1.3.0'
          python -m piper.download_voices es_MX-claude-high
      - name: Generar audio
        run: |
          printf '%s' 'En 1977, un radiotelescopio captó una señal de radio tan extraña que un investigador escribió una palabra: Wow. Duró aproximadamente 72 segundos y nunca volvió a detectarse. Su origen sigue sin confirmarse. No hay pruebas de que fuera una transmisión extraterrestre. ¿Qué crees que ocurrió? Esto es Archivo Enigma.' | python -m piper --model es_MX-claude-high.onnx --output_file voz.wav
      - name: Crear video de prueba
        run: |
          cat > subtitulos.ass <<'EOF'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 720
          PlayResY: 1280
          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,DejaVu Sans,44,&H00FFFFFF,&H000000FF,&H00140A05,&H80000000,-1,0,0,0,100,100,0,0,1,3,1,2,60,60,180,1
          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.00,0:00:30.00,Default,,0,0,0,,La señal Wow!\N1977 · Origen desconocido
          EOF
          ffmpeg -y -f lavfi -i "color=c=0x101529:s=720x1280:r=24" -i voz.wav -vf "subtitles=subtitulos.ass,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARCHIVO ENIGMA':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=120" -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest prueba-wow.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: prueba-wow-archivo-enigma
          path: |
            prueba-wow.mp4
            voz.wav
          retention-days: 7
