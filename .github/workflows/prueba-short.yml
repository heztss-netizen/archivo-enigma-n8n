name: Prueba de Short Archivo Enigma
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prueba-short.yml'
permissions:
  contents: read
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar editor de video
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Instalar voz
        run: |
          python -m pip install 'piper-tts==1.3.0'
          python -m piper.download_voices es_MX-claude-high
      - name: Generar voz y subtitulos
        run: |
          cat > generar.py <<'PY'
          import subprocess, wave
          partes = [
              "En 1977, un radiotelescopio captó una señal de radio muy extraña.",
              "Un investigador escribió una palabra junto a ella: Wow.",
              "La señal duró aproximadamente 72 segundos.",
              "Los astrónomos volvieron a buscarla, pero no lograron detectarla de nuevo.",
              "Su origen sigue sin confirmarse.",
              "No hay pruebas de que fuera una transmisión extraterrestre.",
              "¿Qué crees que ocurrió? Esto es Archivo Enigma."
          ]
          def tiempo(s):
              ms = round(s * 1000)
              h, ms = divmod(ms, 3600000)
              m, ms = divmod(ms, 60000)
              sec, ms = divmod(ms, 1000)
              return f"{h:02}:{m:02}:{sec:02},{ms:03}"
          acum = 0.0
          with open("lista.txt","w") as lista, open("subtitulos.srt","w",encoding="utf-8") as sub:
              for i, texto in enumerate(partes):
                  archivo = f"voz{i}.wav"
                  subprocess.run(["python","-m","piper","--model","es_MX-claude-high.onnx","--output_file",archivo],input=texto,encoding="utf-8",check=True)
                  with wave.open(archivo,"rb") as wav:
                      duracion=wav.getnframes()/wav.getframerate()
                  lista.write(f"file '{archivo}'\n")
                  sub.write(f"{i+1}\n{tiempo(acum)} --> {tiempo(acum+duracion)}\n{texto}\n\n")
                  acum += duracion
          subprocess.run(["ffmpeg","-y","-f","concat","-safe","0","-i","lista.txt","-c","copy","voz.wav"],check=True)
          PY
          python generar.py
      - name: Crear video de prueba
        run: |
          ffmpeg -y -f lavfi -i "color=c=0x101529:s=720x1280:r=24" -i voz.wav -vf "drawbox=x=40:y=80:w=640:h=5:color=0xd4a552:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ARCHIVO ENIGMA':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=120,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='LA SENAL WOW':fontcolor=0xd4a552:fontsize=58:x=(w-text_w)/2:y=400,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='1977  |  72 SEGUNDOS':fontcolor=white:fontsize=30:x=(w-text_w)/2:y=490,subtitles=subtitulos.srt:force_style='FontName=DejaVu Sans,FontSize=20,PrimaryColour=&H00FFFFFF,OutlineColour=&H00100A08,BorderStyle=1,Outline=2,Alignment=2,MarginV=140'" -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest prueba-wow.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: prueba-wow-archivo-enigma
          path: |
            prueba-wow.mp4
            voz.wav
          retention-days: 7
