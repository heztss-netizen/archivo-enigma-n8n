name: Prueba Wan económico
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/animacion-wan.yml'
permissions:
  contents: read
jobs:
  animar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install fal-client requests
      - name: Crear un clip de cinco segundos
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          python - <<'PY'
          import os, requests, fal_client
          if not os.environ.get("FAL_KEY"):
              raise SystemExit("Falta el secreto FAL_KEY")
          url=fal_client.upload_file("assets/escena-wow.jpg")
          resultado=fal_client.subscribe(
              "fal-ai/wan/v2.2-5b/image-to-video",
              arguments={
                  "prompt": "Animate this scene as a cinematic 3D animated film. The astronomer notices the mysterious signal, gently lifts the paper, blinks and reacts with surprise. Subtle moving lights and stars, smooth natural motion, slow camera push-in. Preserve the exact same character, face, glasses, outfit, environment and composition. No scene cut, no added text.",
                  "image_url":url,
                  "num_frames":121, "frames_per_second":24, "aspect_ratio":"9:16"
              }
          )
          video=requests.get(resultado["video"]["url"],timeout=120)
          video.raise_for_status()
          with open("clip-wow.mp4","wb") as salida:
              salida.write(video.content)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: animacion-wan
          path: clip-wow.mp4
          retention-days: 7
